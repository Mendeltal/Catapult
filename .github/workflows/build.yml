name: Build Catapult
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target Catapult_VST3 Catapult_AU -j 4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Catapult-macOS
          path: |
            build/Catapult_artefacts/Release/VST3
            build/Catapult_artefacts/Release/AU
